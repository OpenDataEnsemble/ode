name: Synkronus CLI Build & Release

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'synkronus-cli/**'
      - '.github/workflows/synkronus-cli.yml'
  pull_request:
    paths:
      - 'synkronus-cli/**'
      - '.github/workflows/synkronus-cli.yml'
  release:
    types: [published]

jobs:
  build-cli:
    name: Build synkronus-cli (CI)
    if: github.event_name != 'release'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include: ${{ fromJSON(
          github.event_name == 'pull_request'
          && '[{"goos":"linux","goarch":"amd64"}]'
          || '[{"goos":"linux","goarch":"amd64"},{"goos":"linux","goarch":"arm64"},{"goos":"windows","goarch":"amd64"},{"goos":"windows","goarch":"arm64"},{"goos":"darwin","goarch":"amd64"},{"goos":"darwin","goarch":"arm64"}]'
          ) }}

    env:
      CGO_ENABLED: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: synkronus-cli/go.sum

      - name: Build synkronus-cli
        working-directory: synkronus-cli
        run: |
          mkdir -p dist
          FILENAME=synkronus-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi

          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -o dist/${FILENAME}${EXT} ./cmd/synkronus

          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd dist && zip -r ${FILENAME}.zip ${FILENAME}${EXT})
          else
            tar -C dist -czf dist/${FILENAME}.tar.gz ${FILENAME}
          fi
          rm dist/${FILENAME}${EXT}

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: synkronus-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: synkronus-cli/dist/synkronus-cli-${{ matrix.goos }}-${{ matrix.goarch }}*
          archive: false

  release-cli:
    name: Build & attach release assets
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]

    env:
      CGO_ENABLED: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: synkronus-cli/go.sum

      - name: Build synkronus-cli binaries
        working-directory: synkronus-cli
        run: |
          mkdir -p dist
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -o dist/synkronus-cli-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} ./cmd/synkronus
          ls -R dist

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            synkronus-cli/dist/synkronus-cli-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
