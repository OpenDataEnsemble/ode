name: SBOM (CycloneDX)

# Attach SBOMs to GitHub Releases, or smoke-test generation via workflow_dispatch.

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  GO_VERSION: '1.24.x'

jobs:
  sbom:
    name: Generate CycloneDX SBOMs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        # scripts/sbom/generate-sboms.mjs shells out to `pnpm list`; needs pnpm on PATH.
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            formulus/pnpm-lock.yaml
            formulus-formplayer/pnpm-lock.yaml
            synkronus-portal/pnpm-lock.yaml
            packages/tokens/pnpm-lock.yaml
            packages/components/pnpm-lock.yaml
            packages/observation-query/pnpm-lock.yaml
            desktop/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies for each pnpm project
        # pnpm list requires node_modules to be present in each project dir.
        run: |
          set -euo pipefail
          for d in packages/tokens packages/components packages/observation-query formulus-formplayer formulus synkronus-portal desktop; do
            (cd "$d" && pnpm install --frozen-lockfile)
          done

      - name: Generate SBOMs
        run: node scripts/sbom/generate-sboms.mjs --out sbom-dist

      - name: Upload SBOM artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: cyclonedx-sbom
          path: sbom-dist/*.cdx.json
          retention-days: 30

      - name: Upload SBOMs to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: sbom-dist/*.cdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
