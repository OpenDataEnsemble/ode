allowBuilds:
  '@nestjs/core': true
  '@openapitools/openapi-generator-cli': true
  esbuild: true
  unrs-resolver: true

overrides:
  # Core jest packages pinned to the devDependencies version. Migrated from the
  # package.json "pnpm.overrides" field, which pnpm 11 no longer reads.
  jest: 30.5.1
  '@jest/core': 30.5.1
  jest-cli: 30.5.1
  jest-config: 30.5.1
  jest-circus: 30.5.1
  jest-runner: 30.5.1
  jest-runtime: 30.5.1
  # Auxiliary jest packages bumped for audit fixes.
  jest-environment-node: ^30.4.1
  jest-haste-map: ^30.4.1
  jest-message-util: ^30.4.1
  jest-mock: ^30.4.1
  jest-regex-util: ^30.4.0
  jest-util: ^30.4.1
  jest-validate: ^30.4.1
  jest-worker: ^30.4.1

patchedDependencies:
  '@nozbe/watermelondb@0.28.0': patches/@nozbe__watermelondb@0.28.0.patch
  'react-native-fs@2.20.0': patches/react-native-fs@2.20.0.patch
