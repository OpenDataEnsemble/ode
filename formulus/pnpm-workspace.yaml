allowBuilds:
  '@nestjs/core': true
  '@openapitools/openapi-generator-cli': true
  esbuild: true
  unrs-resolver: true

# pnpm 10+ reads project settings here (not package.json#pnpm).
# Allow lifecycle scripts only for these native/tooling deps.
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@openapitools/openapi-generator-cli'
  - esbuild
  - unrs-resolver

overrides:
  # Core jest packages pinned to the devDependencies version. Migrated from the
  # package.json "pnpm.overrides" field, which pnpm 11 no longer reads.
  jest: 30.3.0
  '@jest/core': 30.3.0
  jest-cli: 30.3.0
  jest-config: 30.3.0
  jest-circus: 30.3.0
  jest-runner: 30.3.0
  jest-runtime: 30.3.0
  # Auxiliary jest packages bumped for audit fixes.
  jest-environment-node: ^30.4.1
  jest-haste-map: ^30.4.1
  jest-message-util: ^30.4.1
  jest-mock: ^30.4.1
  jest-regex-util: ^30.4.0
  jest-util: ^30.4.1
  jest-validate: ^30.4.1
  jest-worker: ^30.4.1
